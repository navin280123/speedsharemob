name: SpeedShare Manual Platform Build Pipeline

on:
  workflow_dispatch: # Manual trigger only (does NOT run automatically on push)
    inputs:
      platform:
        description: "Select platform to build"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - windows
          - linux
          - macos
          - all

permissions:
  contents: write # Grants permission to commit & push built installers back to repository

jobs:
  # -------------------------------------------------------------
  # 1. ANDROID BUILD (.apk)
  # -------------------------------------------------------------
  build-android:
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all'
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          mkdir -p installers
          cp build/app/outputs/flutter-apk/*.apk installers/

      - name: Upload Android Installers
        uses: actions/upload-artifact@v4
        with:
          name: android-installers
          path: installers/*.apk

  # -------------------------------------------------------------
  # 2. WINDOWS BUILD (.exe)
  # -------------------------------------------------------------
  build-windows:
    if: github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all'
    name: Build Windows Setup (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Build MSIX Package for Microsoft Store
        run: dart run msix:create --store

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Windows Setup (.exe) and Package (.msix)
        run: |
          if (!(Test-Path -Path "installers")) { New-Item -ItemType Directory -Path "installers" }
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" inno_setup.iss
          } else {
            iscc inno_setup.iss
          }
          Get-ChildItem -Path "build\windows\x64\runner\Release\*.msix" | Copy-Item -Destination "installers/SpeedShare_Windows.msix"

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: installers/*


  # -------------------------------------------------------------
  # 3. LINUX BUILD (.deb)
  # -------------------------------------------------------------
  build-linux:
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'
    name: Build Linux Package (.deb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux Debian Package
        run: |
          chmod +x installers/create_linux_installer.sh
          bash installers/create_linux_installer.sh

      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: installers/*.deb

  # -------------------------------------------------------------
  # 4. MACOS BUILD (.dmg)
  # -------------------------------------------------------------
  build-macos:
    if: github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all'
    name: Build macOS Disk Image (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build macOS Application
        run: flutter build macos --release

      - name: Create macOS DMG
        run: |
          mkdir -p installers
          hdiutil create -volname "Speed Share" -srcfolder "build/macos/Build/Products/Release/Speed Share.app" -ov -format UDZO "installers/Speed Share.dmg"

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: installers/Speed Share.dmg

  # -------------------------------------------------------------
  # 5. IOS BUILD (.ipa)
  # -------------------------------------------------------------
  build-ios:
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all'
    name: Build iOS Application (.ipa)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS Application
        run: |
          flutter build ios --release --no-codesign
          mkdir -p installers
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r SpeedShare_iOS.ipa Payload
          cp SpeedShare_iOS.ipa ../../../installers/

      - name: Upload iOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: ios-installer
          path: installers/SpeedShare_iOS.ipa

  # -------------------------------------------------------------
  # 6. COMMIT & PUSH BUILT INSTALLERS BACK TO REPOSITORY
  # -------------------------------------------------------------
  commit-installers:
    name: Push Installers to Repository
    needs: [build-android, build-ios, build-windows, build-linux, build-macos]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download built installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: download-artifacts

      - name: Copy installer binaries into installers directory
        run: |
          mkdir -p installers
          find download-artifacts -type f \( -name "*.apk" -o -name "*.exe" -o -name "*.deb" -o -name "*.dmg" -o -name "*.ipa" -o -name "*.msix" \) -exec cp {} installers/ \;
          ls -la installers/

      - name: Commit and push installers to main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add installers/
          if git diff --staged --quiet; then
            echo "No changes in installers directory."
          else
            git commit -m "build: update installer binaries for platform '${{ github.event.inputs.platform }}' [skip ci]"
            git push origin main
          fi