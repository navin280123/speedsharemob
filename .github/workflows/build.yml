name: SpeedShare Manual Platform Build Pipeline

on:
  workflow_dispatch: # Manual trigger only (does NOT run automatically on push)
    inputs:
      platform:
        description: "Select platform to build"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - windows
          - linux
          - macos
          - all

jobs:
  # -------------------------------------------------------------
  # 1. ANDROID BUILD (.apk)
  # -------------------------------------------------------------
  build-android:
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all'
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          mkdir -p installers
          cp build/app/outputs/flutter-apk/*.apk installers/

      - name: Upload Android Installers
        uses: actions/upload-artifact@v4
        with:
          name: android-installers
          path: installers/*.apk

  # -------------------------------------------------------------
  # 2. WINDOWS BUILD (.exe)
  # -------------------------------------------------------------
  build-windows:
    if: github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'all'
    name: Build Windows Setup (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Windows Setup (.exe)
        run: |
          if (!(Test-Path -Path "installers")) { New-Item -ItemType Directory -Path "installers" }
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" inno_setup.iss
          } else {
            iscc inno_setup.iss
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installers/SpeedShare_Windows_Setup.exe

  # -------------------------------------------------------------
  # 3. LINUX BUILD (.deb)
  # -------------------------------------------------------------
  build-linux:
    if: github.event.inputs.platform == 'linux' || github.event.inputs.platform == 'all'
    name: Build Linux Package (.deb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux Debian Package
        run: |
          chmod +x installers/create_linux_installer.sh
          bash installers/create_linux_installer.sh

      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: installers/*.deb

  # -------------------------------------------------------------
  # 4. MACOS BUILD (.dmg)
  # -------------------------------------------------------------
  build-macos:
    if: github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all'
    name: Build macOS Disk Image (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build macOS Application
        run: flutter build macos --release

      - name: Create macOS DMG
        run: |
          mkdir -p installers
          hdiutil create -volname "Speed Share" -srcfolder "build/macos/Build/Products/Release/Speed Share.app" -ov -format UDZO "installers/Speed Share.dmg"

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: installers/Speed Share.dmg